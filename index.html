<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen a Pantalla Completa</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #371959;
        }
        
        .fullscreen-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #371959;
        }
        
        .fullscreen-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        /* Ocultar imágenes inicialmente y mostrar solo la adecuada */
        .desktop-img, .mobile-img {
            display: none;
        }
        
        /* Mostrar imagen de escritorio por defecto */
        .desktop-img {
            display: block;
        }
        
        /* En móviles, mostrar imagen móvil y ocultar desktop */
        @media (max-width: 768px) {
            .desktop-img {
                display: none;
            }
            .mobile-img {
                display: block;
            }
        }
        
        /* Efecto de carga */
        .loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #371959;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(255, 122, 28, 0.3);
            border-radius: 50%;
            border-top-color: #ff7a1c;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loaded .loader {
            opacity: 0;
            pointer-events: none;
        }

        /* Mensaje de error si las imágenes no cargan */
        .error-message {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            background-color: rgba(231, 76, 60, 0.8);
            padding: 20px;
            border-radius: 10px;
            z-index: 1000;
        }
    </style>
</head>
<body class="loading">
    <div class="loader">
        <div class="spinner"></div>
    </div>
    
    <div class="fullscreen-image">
        <img src="assets/img/virginia.png" alt="Imagen de escritorio" class="desktop-img" onerror="handleImageError(this, 'desktop')">
        <img src="assets/img/virginia-2.png" alt="Imagen móvil" class="mobile-img" onerror="handleImageError(this, 'mobile')">
    </div>

    <div class="error-message" id="errorMessage">
        <h2>Error al cargar la imagen</h2>
        <p>No se pudo cargar la imagen. Verifique que la ruta sea correcta.</p>
        <p>Ruta intentada: <span id="imagePath"></span></p>
    </div>

    <script>
        // Función para manejar errores de carga de imágenes
        function handleImageError(img, type) {
            console.error('Error cargando imagen:', img.src);
            
            // Mostrar mensaje de error con la ruta que falló
            document.getElementById('imagePath').textContent = img.src;
            document.getElementById('errorMessage').style.display = 'block';
            
            // Intentar cargar la otra imagen como respaldo
            if (type === 'mobile') {
                document.querySelector('.desktop-img').style.display = 'block';
            } else if (type === 'desktop') {
                // Si estamos en móvil y falla la imagen desktop, intentar mostrar la móvil
                if (window.innerWidth <= 768) {
                    document.querySelector('.mobile-img').style.display = 'block';
                }
            }
            
            // Ocultar loader
            document.body.classList.add('loaded');
            setTimeout(function() {
                document.querySelector('.loader').style.display = 'none';
            }, 500);
        }

        // Ocultar loader cuando las imágenes se carguen
        window.addEventListener('load', function() {
            // Verificar si al menos una imagen se cargó correctamente
            const desktopLoaded = document.querySelector('.desktop-img').complete && document.querySelector('.desktop-img').naturalHeight !== 0;
            const mobileLoaded = document.querySelector('.mobile-img').complete && document.querySelector('.mobile-img').naturalHeight !== 0;
            
            if (desktopLoaded || mobileLoaded) {
                document.body.classList.add('loaded');
                document.body.classList.remove('loading');
                
                // Ocultar completamente el loader después de la transición
                setTimeout(function() {
                    document.querySelector('.loader').style.display = 'none';
                }, 500);
            } else {
                // Si ninguna imagen cargó, mostrar error después de un tiempo
                setTimeout(function() {
                    handleImageError({src: 'assets/img/virginia.png o assets/img/virginia-2.png'}, 'both');
                }, 3000);
            }
        });
        
        // Detectar cambios de orientación en dispositivos móviles
        window.addEventListener('orientationchange', function() {
            // Recargar la página al cambiar de orientación para asegurar que se muestre la imagen correcta
            setTimeout(function() {
                window.location.reload();
            }, 300);
        });
    </script>
</body>
</html>
